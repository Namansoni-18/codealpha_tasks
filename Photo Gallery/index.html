<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo Gallery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>My Photo Gallery</h1>
<p class="subtitle">A few frames worth a second look</p>
</header>

<div class="layout">

<!-- Sidebar -->
<nav class="sidebar">
<button class="filter-btn active" data-filter="all">All Albums</button>
<button class="filter-btn" data-filter="library">Library</button>
<button class="filter-btn" data-filter="collection">Collection</button>
<button class="filter-btn" data-filter="favorites">Favorites</button>
<button class="filter-btn" data-filter="videos">Videos</button>
<button class="filter-btn" data-filter="nature">Nature</button>
<button class="filter-btn" data-filter="city">City</button>
<button class="filter-btn" data-filter="people">People</button>
</nav>

<!-- Gallery -->
<div class="gallery-wrap">
<div class="controls">
<input type="text" id="searchInput" placeholder="Search photos..." class="search-box">
<select id="sortSelect" class="sort-select">
<option value="default">Sort: Default</option>
<option value="name-asc">Name: A → Z</option>
<option value="name-desc">Name: Z → A</option>
<option value="category">Category</option>
</select>
<span class="photo-count" id="photoCount"></span>
</div>

<div class="gallery">
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/nature1/400/300" alt="Sunrise Ridge" data-category="nature"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/nature2/400/300" alt="Forest Trail" data-category="nature"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/nature3/400/300" alt="Misty Valley" data-category="nature"></div>

<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/city1/400/300" alt="Downtown Lights" data-category="city"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/city2/400/300" alt="Rainy Crossroad" data-category="city"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/city3/400/300" alt="Skyline at Dusk" data-category="city"></div>

<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/people1/400/300" alt="Street Portrait" data-category="people"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/people2/400/300" alt="Market Vendor" data-category="people"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/people3/400/300" alt="Kids at Play" data-category="people"></div>

<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/library1/400/300" alt="Old Manuscripts" data-category="library"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/library2/400/300" alt="Reading Corner" data-category="library"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/library3/400/300" alt="Archive Shelves" data-category="library"></div>

<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/collection1/400/300" alt="Vintage Cars" data-category="collection"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/collection2/400/300" alt="Antique Cameras" data-category="collection"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/collection3/400/300" alt="Coin Display" data-category="collection"></div>

<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/favorites1/400/300" alt="Family Trip" data-category="favorites"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/favorites2/400/300" alt="Birthday Evening" data-category="favorites"></div>
<div class="photo-card"><img class="gallery-media" src="https://picsum.photos/seed/favorites3/400/300" alt="Weekend Getaway" data-category="favorites"></div>

<div class="photo-card">
  <video class="gallery-media" data-category="videos" data-title="Big Buck Bunny" data-type="video" poster="https://picsum.photos/seed/videoposter1/400/300" preload="metadata" muted playsinline>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
  </video>
  <span class="play-icon">&#9658;</span>
</div>
<div class="photo-card">
  <video class="gallery-media" data-category="videos" data-title="Elephants Dream" data-type="video" poster="https://picsum.photos/seed/videoposter2/400/300" preload="metadata" muted playsinline>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" type="video/mp4">
  </video>
  <span class="play-icon">&#9658;</span>
</div>
<div class="photo-card">
  <video class="gallery-media" data-category="videos" data-title="For Bigger Blazes" data-type="video" poster="https://picsum.photos/seed/videoposter3/400/300" preload="metadata" muted playsinline>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
  </video>
  <span class="play-icon">&#9658;</span>
</div>
</div>
</div>

</div>

<!-- Lightbox overlay -->
<div class="lightbox" id="lightbox">
<span class="close-btn" id="closeBtn">&times;</span>
<span class="arrow prev" id="prevBtn">&#10094;</span>
<img id="lightbox-img" src="" alt="">
<video id="lightbox-video" controls playsinline></video>
<span class="arrow next" id="nextBtn">&#10095;</span>
<div class="lb-counter" id="lbCounter"></div>
</div>

<script src="script.js"></script>
</body>
</html>
